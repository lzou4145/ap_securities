name: ap_securities
description: 亚太证券官方移动客户端
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.6.0
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.0
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_slidable: ^3.1.2
  flutter_svg: ^2.2.0
  flutter_widget_from_html: ^0.16.1
  go_router: ^14.6.0
  intl: ^0.19.0
  mqtt_client: ^10.5.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icons/app_launcher_icon.png
  adaptive_icon_background: "#23272E"
  adaptive_icon_foreground: assets/app_icons/app_launcher_icon.png
  web:
    generate: true
    image_path: assets/app_icons/app_launcher_icon.png
    background_color: "#23272E"
    theme_color: "#2D8BFF"
  windows:
    generate: true
    image_path: assets/app_icons/app_launcher_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app_icons/app_launcher_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icons/
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: D-DIN
      fonts:
        - asset: assets/fonts/D-DIN.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
